<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="kikiInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28221b"/>
      <stop offset="100%" stop-color="#16130f"/>
    </linearGradient>
    <linearGradient id="kikiAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a29"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </linearGradient>
    <radialGradient id="beaconAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8590c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8590c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground squircle in warm deep ink -->
  <rect x="14" y="14" width="228" height="228" rx="54" fill="url(#kikiInk)" stroke="#e7dfd0" stroke-opacity="0.28" stroke-width="2.5"/>

  <!-- Letter 'K' in warm paper -->
  <!-- Stem -->
  <rect x="64" y="56" width="28" height="144" rx="4" fill="#fffdf8"/>
  <!-- Upper arm -->
  <polygon points="92,138 152,70 190,70 120,148" fill="#fffdf8"/>
  <!-- Lower leg -->
  <polygon points="110,134 190,200 150,200 92,148" fill="#fffdf8"/>

  <!-- Active Agent Beacon Spark -->
  <circle cx="194" cy="66" r="28" fill="url(#beaconAura)"/>
  <circle cx="194" cy="66" r="22" fill="none" stroke="#ff8340" stroke-width="2.2" stroke-opacity="0.6"/>
  <circle cx="194" cy="66" r="16.5" fill="url(#kikiAccent)"/>
  <circle cx="190" cy="62" r="4.2" fill="#fffdf8" fill-opacity="0.9"/>
</svg>