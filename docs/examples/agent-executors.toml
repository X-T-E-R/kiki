args = ["--acp"]
shutdown_grace_ms = 3000
model_binding = "session_config"
model_config_category = "model"
revision = "2026-08-30.1"

[agent_executors.kimi-acp]
protocol = "acp-v1"
command = "kimi"
args = ["acp"]
shutdown_grace_ms = 3000
model_binding = "session_config"
model_config_category = "model"
revision = "2026-08-30.1"

[agent_executors.opencode-acp]
protocol = "acp-v1"
command = "opencode"
args = ["acp"]
shutdown_grace_ms = 3000
model_binding = "session_config"
model_config_category = "model"
revision = "2026-08-30.1"
