[agent_executors.grok-acp]
protocol = "acp-v1"
command = "grok"
args = ["--no-auto-update", "agent", "stdio"]
startup_timeout_ms = 70000
shutdown_grace_ms = 3000
model_binding = "session_config"
model_config_category = "model"
revision = "2026-08-30.1"

[agent_executors.codex-acp]
protocol = "acp-v1"
command = "codex-acp"
args = []
env = { DISABLE_MCP_CONFIG_FILTERING = "true" }
startup_timeout_ms = 150000
shutdown_grace_ms = 3000
model_binding = "session_config"
model_config_category = "model"
revision = "2026-08-30.1"

[agent_executors.cursor-acp]
protocol = "acp-v1"
command = "cursor-agent"
args = ["acp"]
shutdown_grace_ms = 3000
model_binding = "argv"
model_args = ["--model", "{model}"]
revision = "2026-08-30.1"

[agent_executors.claude-acp]
protocol = "acp-v1"
command = "claude-agent-acp"
args = []
shutdown_grace_ms = 3000
model_binding = "session_config"
model_config_category = "model"
revision = "2026-08-30.1"

[agent_executors.gemini-acp]
protocol = "acp-v1"
