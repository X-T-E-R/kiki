name: Kiki Release Version Preparation

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Version metadata or generated candidate sources; neither publishes a release'
        required: true
        default: version
        type: choice
        options:
          - version
          - generate
          - build
          - recover
      base_sha:
        description: 'Exact prepared commit SHA; the version patch applies only to this commit'
        required: true
        type: string
      expected_version:
        description: 'Expected stable CLI and desktop version'
        required: true
        default: '0.3.0'
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: kiki-version-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.stage == 'version' || inputs.stage == '' }}
    name: Generate version patch only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Checkout exact preparation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate preparation inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'base_sha must be a full commit SHA.' >&2; exit 1; }
          [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'expected_version must be a stable semantic version.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm version:release

      - name: Check stable CLI and desktop version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readDesktopVersions, assertDesktopVersions } from './apps/kiki-gui/scripts/desktop-version.mjs';
          const expected = process.env.EXPECTED_VERSION;
          const actual = assertDesktopVersions(readDesktopVersions(), `kiki-v${expected}`);
          if (actual !== expected) throw new Error(`Expected ${expected}, received ${actual}`);
          console.log(`CLI and desktop versions agree: ${actual}`);
          NODE

      - name: Capture complete version patch and receipt
        shell: bash
        run: |
          python3 <<'PY'
          import datetime, hashlib, json, os, pathlib, re, subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          base = os.environ['BASE_SHA']
          version = os.environ['EXPECTED_VERSION']
          if git('rev-parse', 'HEAD').decode().strip() != base:
              raise RuntimeError('Preparation commit changed during version generation')
          raw = git('diff', '--name-status', '-z', '--no-renames', 'HEAD').decode().split('\0')
          changes = [{'status': raw[i], 'path': raw[i + 1]} for i in range(0, len(raw) - 1, 2)]
          added = [name for name in git('ls-files', '--others', '--exclude-standard', '-z').decode().split('\0') if name]
          changes += [{'status': 'A', 'path': name} for name in added]
          if not changes:
              raise RuntimeError('No release version changes were generated')
          allowed = {
              'package.json', 'CHANGELOG.md', 'pnpm-lock.yaml', 'system.yaml',
              'apps/kiki-gui/src-tauri/tauri.conf.json',
              'apps/kiki-gui/src-tauri/Cargo.toml', 'apps/kiki-gui/src-tauri/Cargo.lock',
          }
          consumed = []
          for change in changes:
              name, status = change['path'], change['status']
              if re.fullmatch(r'\.changeset/[^/]+\.md', name) and name != '.changeset/README.md' and status == 'D':
                  consumed.append(name)
              elif name not in allowed and not re.fullmatch(r'(apps|packages)/[^/]+/(package\.json|CHANGELOG\.md)', name):
                  raise RuntimeError(f'Unexpected non-version output: {status} {name}')
              if status not in ('A', 'M', 'D'):
                  raise RuntimeError(f'Unexpected change kind: {status} {name}')
          if not consumed:
              raise RuntimeError('Version generation did not consume any changesets')
          patch = git('diff', '--binary', '--full-index', '--no-ext-diff', '--no-renames', 'HEAD')
          for name in sorted(added):
              result = subprocess.run(['git', 'diff', '--no-index', '--binary', '--full-index', '--no-ext-diff', '--', os.devnull, name], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode != 1 or not result.stdout:
                  raise RuntimeError(f'Could not capture new version file: {name}')
              patch += result.stdout
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kiki-version-output'
          output.mkdir(parents=True, exist_ok=True)
          patch_path = output / 'version.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--reverse', '--check', str(patch_path)], check=True)
          receipt = {
              'schemaVersion': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'baseSha': base,
              'version': version,
              'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'patchFile': 'version.patch',
              'patchSha256': hashlib.sha256(patch).hexdigest(),
              'changes': sorted(changes, key=lambda item: item['path']),
              'consumedChangesets': sorted(consumed),
          }
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(f"Captured {len(changes)} version paths, including {len(added)} new files and {len(consumed)} consumed changesets")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"## Version preparation only\n\nBase: `{base}`\n\nVersion: `{version}`\n\nApply `version.patch` only to this exact base after checking `receipt.json`. No commit, push, tag, release, or npm publication was performed.\n")
          PY

      - name: Upload version increment
        uses: actions/upload-artifact@v7
        with:
          name: kiki-version-${{ inputs.expected_version }}-${{ inputs.base_sha }}
          path: ${{ runner.temp }}/kiki-version-output/
          if-no-files-found: error
          retention-days: 7

  generate:
    if: ${{ inputs.stage == 'generate' }}
    name: Generate candidate manifests and Cargo lock only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      WORKFLOW_CODE_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - name: Validate exact source and stable version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          test "$(node apps/kiki-gui/scripts/desktop-version.mjs check)" = "$EXPECTED_VERSION"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate from normal project commands
        shell: bash
        env:
          KIKI_HOME: ${{ runner.temp }}/kiki-generation-home
        run: |
          python3 <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, tomllib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kiki-generated-output'
          output.mkdir(parents=True, exist_ok=True)
          commands = [
              ['pnpm', 'install', '--frozen-lockfile'],
              ['pnpm', '--filter', '@kiki/agent-core-v2', 'run', 'gen:state-manifest'],
              ['pnpm', '--filter', '@kiki/agent-core-v2', 'run', 'gen:wire-manifest'],
              ['pnpm', '--filter', '@kiki/agent-core-v2', 'run', 'gen:config-manifest'],
              ['cargo', 'update', '--workspace', '--manifest-path', 'apps/kiki-gui/src-tauri/Cargo.toml'],
          ]
          exits = []
          for command in commands:
              print('+ ' + ' '.join(command), flush=True)
              result = subprocess.run(command)
              exits.append({'command': command, 'exitCode': result.returncode})
              (output / 'commands.json').write_text(json.dumps(exits, indent=2) + '\n')
              if result.returncode != 0:
                  raise SystemExit(result.returncode)
          def git(*args):
              return subprocess.check_output(['git', *args])
          base = os.environ['BASE_SHA']
          if git('rev-parse', 'HEAD').decode().strip() != base:
              raise RuntimeError('Source SHA changed')
          allowed = {
              'packages/agent-core-v2/docs/state-manifest.d.ts',
              'packages/agent-core-v2/docs/wire-manifest.d.ts',
              'packages/agent-core-v2/docs/config-manifest.toml',
              'apps/kiki-gui/src-tauri/Cargo.lock',
          }
          raw = git('diff', '--name-status', '-z', '--no-renames', 'HEAD').decode().split('\0')
          changes = [{'status': raw[i], 'path': raw[i+1]} for i in range(0, len(raw)-1, 2)]
          if git('ls-files', '--others', '--exclude-standard', '-z').strip(b'\0'):
              raise RuntimeError('Unexpected untracked generated source')
          for change in changes:
              if change['path'] not in allowed or change['status'] != 'M':
                  raise RuntimeError(f'Unexpected generation output: {change}')
              name = change['path']
              before, after = git('show', f'{base}:{name}'), pathlib.Path(name).read_bytes()
              change.update(beforeSha256=hashlib.sha256(before).hexdigest(), afterSha256=hashlib.sha256(after).hexdigest(), afterBytes=len(after))
          lock = tomllib.loads(pathlib.Path('apps/kiki-gui/src-tauri/Cargo.lock').read_text())
          desktop = [entry for entry in lock['package'] if entry['name'] == 'kiki-desktop']
          if len(desktop) != 1 or desktop[0]['version'] != os.environ['EXPECTED_VERSION']:
              raise RuntimeError('Normal Cargo update did not synchronize the desktop version')
          patch = git('diff', '--binary', '--full-index', '--no-ext-diff', '--no-renames', 'HEAD')
          patch_path = output / 'generated.patch'
          patch_path.write_bytes(patch)
          if patch:
              subprocess.run(['git', 'apply', '--reverse', '--check', str(patch_path)], check=True)
          receipt = {
              'schemaVersion': 1, 'repository': os.environ['GITHUB_REPOSITORY'],
              'baseSha': base, 'sourceTree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'workflowCodeSha': os.environ['WORKFLOW_CODE_SHA'],
              'version': os.environ['EXPECTED_VERSION'], 'commandExits': exits,
              'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'patchFile': 'generated.patch', 'patchSha256': hashlib.sha256(patch).hexdigest(),
              'changes': changes, 'allowedPaths': sorted(allowed), 'cargoDesktopVersion': desktop[0]['version'],
          }
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Upload generated source patch and command receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kiki-generated-${{ inputs.expected_version }}-${{ inputs.base_sha }}
          path: ${{ runner.temp }}/kiki-generated-output/
          if-no-files-found: error
          retention-days: 7

  build:
    if: ${{ inputs.stage == 'build' }}
    name: Build exact Windows x64 candidate without publishing
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      KIKI_BUILD_SHA: ${{ inputs.base_sha }}
      KIKI_UPDATE_CHANNEL: stable
      KIKI_DISTRIBUTION: local
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout exact generated source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check, build and stage the normal candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BASE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected an exact source SHA' }
          if ($env:EXPECTED_VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Expected a stable version' }
          if ((git rev-parse HEAD).Trim() -cne $env:BASE_SHA) { throw 'Checkout identity mismatch' }
          if (git status --porcelain) { throw 'Candidate checkout is not clean' }
          $output = Join-Path $env:RUNNER_TEMP 'kiki-windows-output'
          $candidate = Join-Path $output 'candidate'
          New-Item -ItemType Directory -Force $candidate | Out-Null
          $env:KIKI_HOME = Join-Path $env:RUNNER_TEMP 'kiki-build-home'
          $env:KIKI_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'kiki-build-cache'
          $script:commands = @()
          function Invoke-CandidateCommand([string]$Executable, [string[]]$CommandArgs) {
            & $Executable @CommandArgs
            $code = $LASTEXITCODE
            $script:commands += @{ command = @($Executable) + $CommandArgs; exitCode = $code }
            ConvertTo-Json -InputObject $script:commands -Depth 5 | Set-Content -Encoding utf8 (Join-Path $output 'commands.json')
            if ($code -ne 0) { throw "Command failed ($code): $Executable $($CommandArgs -join ' ')" }
          }
          Invoke-CandidateCommand 'pnpm' @('install', '--frozen-lockfile')
          Invoke-CandidateCommand 'node' @('apps/kiki-gui/scripts/desktop-version.mjs', 'check')
          if ((node apps/kiki-gui/scripts/desktop-version.mjs check).Trim() -cne $env:EXPECTED_VERSION) { throw 'Version identity mismatch' }
          $checkSource = 'f863bc701da6985e0afc1b559b0e9651006ecbf7'
          Invoke-CandidateCommand 'git' @('fetch', '--no-tags', '--depth', '1', 'origin', $checkSource)
          $changed = @(git diff --name-only $checkSource HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare the prior successful check inputs' }
          $checkNeutralPaths = @('.github/workflows/kiki-version-prepare.yml', 'packages/agent-core-v2/test/state/builtinReplayableKeys.ts')
          $reuseChecks = @($changed | Where-Object { $checkNeutralPaths -cnotcontains $_ }).Count -eq 0
          $reused = @()
          if ($reuseChecks) {
            $reused = @(@{ sourceSha = $checkSource; runUrl = 'https://github.com/X-T-E-R/kiki/actions/runs/38109665987'; checks = @('GUI types', 'KAP types', 'OnboardingWizard 50 tests', 'HTTP prompt roundtrip', 'onboarding storage 4 tests', 'requester attempt identity', 'actual 401 loop/live/cold', 'idempotent frame removal'); allListedChecksPassed = $true })
          } else {
            $typeFailures = @()
            try { Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/gui', 'run', 'typecheck') } catch { $typeFailures += $_.Exception.Message }
            try { Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/kap-server', 'run', 'typecheck') } catch { $typeFailures += $_.Exception.Message }
            if ($typeFailures.Count -gt 0) { throw ($typeFailures -join "`n") }
            Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/gui', 'exec', 'vitest', 'run', 'src/components/OnboardingWizard.test.tsx', '--maxWorkers=1', '--no-file-parallelism')
            Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/gui', 'exec', 'vitest', 'run', 'src/lib/client.test.ts', '-t', 'round-trips the canonical reply paragraph over HTTP', '--maxWorkers=1', '--no-file-parallelism')
            Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/session-core', 'exec', 'vitest', 'run', 'src/settings/onboarding.test.ts', '--maxWorkers=1', '--no-file-parallelism')
            Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/agent-core-v2', 'exec', 'vitest', 'run', 'test/kosong/model/modelRequester.test.ts', '-t', 'assigns one response instance per actual attempt', '--maxWorkers=1', '--no-file-parallelism')
            Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/transcript-live', 'exec', 'vitest', 'run', 'test/liveAdapter.test.ts', '-t', 'retracts an actual 401 retry through the loop, live projection and durable cold replay', '--maxWorkers=1', '--no-file-parallelism')
            Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/transcript', 'exec', 'vitest', 'run', 'test/layers.test.ts', '-t', 'retracts discarded streaming frames idempotently in stores and subscriber grades', '--maxWorkers=1', '--no-file-parallelism')
          }
          ConvertTo-Json -InputObject $reused -Depth 5 | Set-Content -Encoding utf8 (Join-Path $output 'reused-checks.json')
          Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/agent-core-v2', 'exec', 'vitest', 'run', 'test/agent/loop/loop.test.ts', '-t', 'discards the interrupted attempt fragments|preserves partial thinking on user cancel', '--maxWorkers=1', '--no-file-parallelism')
          Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/agent-profiles', 'exec', 'vitest', 'run', 'test/profileShared.test.ts', '-t', 'replaces registered system sections before rendering variables', '--maxWorkers=1', '--no-file-parallelism')
          $env:KIKI_BUILT_IN_CATALOG_FILE = Join-Path $env:RUNNER_TEMP 'kiki-built-in-catalog.json'
          Invoke-CandidateCommand 'node' @('apps/kimi-code/scripts/update-catalog.mjs', '--out', $env:KIKI_BUILT_IN_CATALOG_FILE)
          Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/cli', 'run', 'build:native:release')
          Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/cli', 'run', 'test:native:smoke')
          Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/cli', 'run', 'package:native')
          $tauriConfig = Join-Path $env:RUNNER_TEMP 'kiki-tauri-candidate-config.json'
          $bundleInfo = Join-Path $env:RUNNER_TEMP 'kiki-installer-build-info.json'
          $provenance = @{ sourceSha = $env:BASE_SHA; sourceTree = (git rev-parse 'HEAD^{tree}').Trim(); version = $env:EXPECTED_VERSION; target = 'x86_64-pc-windows-msvc' }
          [System.IO.File]::WriteAllText($bundleInfo, ($provenance | ConvertTo-Json -Depth 4), [System.Text.UTF8Encoding]::new($false))
          $resources = @{ '../THIRD_PARTY_NOTICES.md' = 'THIRD_PARTY_NOTICES.md'; $bundleInfo = 'build-info.json' }
          $config = @{ build = @{ beforeBuildCommand = 'pnpm desktop:prepare' }; bundle = @{ createUpdaterArtifacts = $false; resources = $resources } }
          [System.IO.File]::WriteAllText($tauriConfig, ($config | ConvertTo-Json -Depth 5), [System.Text.UTF8Encoding]::new($false))
          Invoke-CandidateCommand 'pnpm' @('--filter', '@kiki/gui', 'run', 'desktop:build', '--ci', '--target', 'x86_64-pc-windows-msvc', '--config', $tauriConfig)
          $installers = @(Get-ChildItem 'apps/kiki-gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS Windows x64 installer' }
          $installerRoot = Join-Path $output 'installer'
          New-Item -ItemType Directory -Force $installerRoot | Out-Null
          Copy-Item $installers[0].FullName (Join-Path $installerRoot $installers[0].Name)
          $audit = Join-Path $env:RUNNER_TEMP 'kiki-installer-audit'
          Invoke-CandidateCommand '7z' @('x', $installers[0].FullName, "-o$audit", '-y')
          $payload = @()
          foreach ($item in @(@{ name = 'kiki-desktop.exe'; source = 'apps/kiki-gui/src-tauri/target/x86_64-pc-windows-msvc/release/kiki-desktop.exe' }, @{ name = 'kiki-server.exe'; source = 'apps/kimi-code/dist-native/bin/win32-x64/kiki.exe' }, @{ name = 'THIRD_PARTY_NOTICES.md'; source = 'apps/kiki-gui/THIRD_PARTY_NOTICES.md' }, @{ name = 'build-info.json'; source = $bundleInfo })) {
            $matches = @(Get-ChildItem $audit -Recurse -File -Filter $item.name)
            $expected = (Get-FileHash $item.source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($matches.Count -ne 1 -or (Get-FileHash $matches[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw "Installer payload mismatch: $($item.name)" }
            $payload += @{ name = $item.name; bytes = $matches[0].Length; sha256 = $expected }
          }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          $installerReceipt = @{ schemaVersion = 1; provenance = $provenance; originalName = $installers[0].Name; bytes = $installers[0].Length; sha256 = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant(); authenticodeStatus = $signature.Status.ToString(); updaterSigned = $false; payload = $payload }
          $installerReceipt | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $installerRoot 'installer-receipt.json')
          if (git status --porcelain --untracked-files=no) { throw 'Build changed tracked source or lockfiles' }
          Copy-Item 'apps/kiki-gui/src-tauri/target/x86_64-pc-windows-msvc/release/kiki-desktop.exe' (Join-Path $candidate 'kiki-desktop.exe')
          Copy-Item 'apps/kimi-code/dist-native/bin/win32-x64/kiki.exe' (Join-Path $candidate 'kiki-server.exe')
          Copy-Item 'apps/kiki-gui/src-tauri/binaries/kiki-server-x86_64-pc-windows-msvc.exe.manifest.json' (Join-Path $candidate 'kiki-server.exe.manifest.json')
          Copy-Item 'apps/kiki-gui/dist' (Join-Path $candidate 'gui-dist') -Recurse
          Copy-Item 'apps/kimi-code/dist-native/artifacts/auth-native' (Join-Path $candidate 'auth-native') -Recurse
          Copy-Item $env:KIKI_BUILT_IN_CATALOG_FILE (Join-Path $candidate 'built-in-catalog.json')
          "gitSha: $env:BASE_SHA" | Set-Content -Encoding utf8 (Join-Path $candidate 'build-info.txt')
          $env:KIKI_CANDIDATE_OUTPUT = $candidate
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const root = process.env.KIKI_CANDIDATE_OUTPUT;
          const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const sidecar = JSON.parse(fs.readFileSync(path.join(root, 'kiki-server.exe.manifest.json'), 'utf8'));
          const server = fs.readFileSync(path.join(root, 'kiki-server.exe'));
          if (sidecar.schemaVersion !== 2 || sidecar.buildId !== process.env.BASE_SHA || sidecar.serverVersion !== process.env.EXPECTED_VERSION || sidecar.sha256 !== hash(server) || sidecar.bytes !== server.length) throw new Error('Sidecar provenance mismatch');
          const info = {
            schemaVersion: 1, sourceSha: process.env.BASE_SHA,
            sourceTree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            version: process.env.EXPECTED_VERSION, target: 'x86_64-pc-windows-msvc',
            channel: process.env.KIKI_UPDATE_CHANNEL, distribution: process.env.KIKI_DISTRIBUTION,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            commands: JSON.parse(fs.readFileSync(path.join(root, '..', 'commands.json'), 'utf8')),
