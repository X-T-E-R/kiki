name: Kiki Android CI

on:
  pull_request:
    paths:
      - '.github/workflows/kiki-android-ci.yml'
      - 'apps/kiki-android/**'
      - '.github/workflows/kiki-android-signing-check.yml'
      - '.github/workflows/kiki-desktop-release.yml'
      - 'apps/kiki-gui/mobile/**'
      - 'apps/kiki-gui/package.json'
      - 'apps/kiki-gui/scripts/desktop-version.mjs'
      - 'apps/kiki-gui/scripts/verify-updater-signature.mjs'
      - 'apps/kimi-code/scripts/native/**'
      - '.nvmrc'
  push:
    branches: ['**']
    paths:
      - '.github/workflows/kiki-android-ci.yml'
      - 'apps/kiki-android/**'
      - '.github/workflows/kiki-android-signing-check.yml'
      - '.github/workflows/kiki-desktop-release.yml'
      - 'apps/kiki-gui/mobile/**'
      - 'apps/kiki-gui/package.json'
      - 'apps/kiki-gui/scripts/desktop-version.mjs'
      - 'apps/kiki-gui/scripts/verify-updater-signature.mjs'
      - 'apps/kimi-code/scripts/native/**'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiki-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mobile=false
          android=false

          classify_paths() {
            while IFS= read -r path; do
              case "$path" in
                '.github/workflows/kiki-android-ci.yml'|'.github/workflows/kiki-android-signing-check.yml'|'.github/workflows/kiki-desktop-release.yml'|'apps/kiki-gui/mobile/'*|'apps/kiki-gui/package.json'|'apps/kiki-gui/scripts/desktop-version.mjs'|'apps/kiki-gui/scripts/verify-updater-signature.mjs'|'apps/kimi-code/scripts/native/'*|'.nvmrc')
                  mobile=true
                  ;;
              esac
              case "$path" in
                '.github/workflows/kiki-android-ci.yml'|'apps/kiki-android/'*|'.nvmrc')
                  android=true
                  ;;
              esac
            done
          }

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            mobile=true
            android=true
          else
            if [[ "$BASE_SHA" == '0000000000000000000000000000000000000000' ]]; then
              git ls-tree -r --name-only "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            else
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            fi
            classify_paths < "$RUNNER_TEMP/changed-paths"
          fi

          {
            echo "mobile=$mobile"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"

  debug-apk:
    name: Build installable debug APK
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIKI_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/kiki-gui/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Install locked shell dependencies
        working-directory: apps/kiki-gui/mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install headless Chromium for shell browser tests
        working-directory: apps/kiki-gui/mobile
        run: ./node_modules/.bin/playwright install chromium
      - name: Test Android packaging and launcher contracts
        working-directory: apps/kiki-gui/mobile
        run: npm test
      - name: Build debug APK from source
        working-directory: apps/kiki-gui/mobile
        run: npm run android:debug
      - name: Verify and stage APK, checksum and source receipt
        run: |
          node apps/kiki-gui/mobile/scripts/android-artifact.mjs stage \
            --variant debug --apk apps/kiki-gui/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            --output "$RUNNER_TEMP/kiki-android-debug"
          node apps/kiki-gui/mobile/scripts/android-artifact.mjs verify \
            --variant debug --directory "$RUNNER_TEMP/kiki-android-debug"
          cat "$RUNNER_TEMP/kiki-android-debug/android-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified debug APK (not a product release)
        uses: actions/upload-artifact@v7
        with:
          name: kiki-android-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kiki-android-debug/
          if-no-files-found: error
          retention-days: 14

  android-unit-tests:
    name: Run Gradle debug unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/kiki-android/**/*.gradle*
            apps/kiki-android/gradle/libs.versions.toml
            apps/kiki-android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Test Android Gradle modules
        working-directory: apps/kiki-android
        run: ./gradlew testDebugUnitTest
