name: Kiki Desktop Release

on:
  push:
    tags:
      - 'kiki-v*'

permissions:
  contents: read

concurrency:
  group: kiki-desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^kiki-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Kiki desktop tags must be kiki-v<major>.<minor>.<patch> or kiki-v<major>.<minor>.<patch>-beta.<number>." >&2
            exit 1
          fi
          version="${tag#kiki-v}"
          if [[ "$version" == *'-beta.'* ]]; then
            channel='beta'
          else
            channel='stable'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Require updater public key
        shell: bash
        env:
          KIKI_UPDATER_PUBLIC_KEY: ${{ vars.KIKI_UPDATER_PUBLIC_KEY }}
        run: |
          if [ -z "$KIKI_UPDATER_PUBLIC_KEY" ]; then
            echo 'The KIKI_UPDATER_PUBLIC_KEY repository variable is required to build the updater artifact.' >&2
            exit 1
          fi

  prepare:
    name: Freeze release inputs
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      producer-attempt: ${{ steps.input.outputs.producer-attempt }}
      source-sha: ${{ steps.input.outputs.source-sha }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Fetch catalog and write immutable input receipt
        id: input
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          input="$RUNNER_TEMP/kiki-release-input"
          mkdir -p "$input"
          node apps/kimi-code/scripts/update-catalog.mjs --out "$input/built-in-catalog.json"
          node apps/kimi-code/scripts/native/release-receipt.mjs prepare \
            --catalog "$input/built-in-catalog.json" \
            --output "$input/release-input.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$source_sha" \
            --tag "$GITHUB_REF_NAME" \
            --version '${{ needs.validate.outputs.version }}' \
            --channel '${{ needs.validate.outputs.channel }}' \
            --run-id "$GITHUB_RUN_ID" \
            --producer-attempt "$GITHUB_RUN_ATTEMPT"
          {
            echo "source-sha=$source_sha"
            echo "producer-attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable release input
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: kiki-release-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kiki-release-input/
          if-no-files-found: error
          retention-days: 7

  cli-native:
    name: Native and desktop target builds
    needs:
      - validate
      - prepare
    uses: ./.github/workflows/_native-build.yml
    with:
      retention-days: 7
      sign-macos: false
      build-desktop: true
      prepare-artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      prepare-run-attempt: ${{ needs.prepare.outputs.producer-attempt }}
      release-source-sha: ${{ needs.prepare.outputs.source-sha }}
      release-tag: ${{ github.ref_name }}
      release-version: ${{ needs.validate.outputs.version }}
      release-channel: ${{ needs.validate.outputs.channel }}
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - prepare
      - cli-native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: X-T-E-R/kiki
      KIKI_TAG: ${{ github.ref_name }}
      KIKI_VERSION: ${{ needs.validate.outputs.version }}
      KIKI_CHANNEL: ${{ needs.validate.outputs.channel }}
      KIKI_SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      KIKI_PREPARE_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact-id }}
      KIKI_PREPARE_ATTEMPT: ${{ needs.prepare.outputs.producer-attempt }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install signing tool
        run: pnpm install --frozen-lockfile

      - name: Download immutable release input
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/kiki-release-input

      - name: Select one target artifact per platform
        id: target-artifacts
        shell: bash
        run: |
          set -euo pipefail
          api="$RUNNER_TEMP/target-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$api"
          node apps/kimi-code/scripts/native/release-receipt.mjs select-artifacts \
            --api-json "$api" \
            --run-id "$GITHUB_RUN_ID" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download selected target release candidates
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.target-artifacts.outputs.artifact-ids }}
          path: target-candidates

      - name: Validate and assemble exact target candidates
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/kiki-release-input"
          node apps/kimi-code/scripts/native/release-receipt.mjs verify-candidates \
            --artifacts target-candidates \
            --native-output cli-native \
            --desktop-output release-candidate \
            --receipt "$input/release-input.json" \
            --catalog "$input/built-in-catalog.json" \
            --prepare-artifact-id "$KIKI_PREPARE_ARTIFACT_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$KIKI_SOURCE_SHA" \
            --tag "$KIKI_TAG" \
            --version "$KIKI_VERSION" \
            --channel "$KIKI_CHANNEL" \
            --run-id "$GITHUB_RUN_ID" \
            --prepare-attempt "$KIKI_PREPARE_ATTEMPT"
          echo "KIKI_BUILT_IN_CATALOG_FILE=$input/built-in-catalog.json" >> "$GITHUB_ENV"

          shopt -s nullglob
          installers=(release-candidate/*-setup.exe)
          appimages=(release-candidate/*.AppImage)
          debs=(release-candidate/*.deb)
          arm_dmgs=(release-candidate/*aarch64*.dmg)
          intel_dmgs=(release-candidate/*x64*.dmg)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#appimages[@]}" -ne 1 ] || [ "${#debs[@]}" -ne 1 ] || [ "${#arm_dmgs[@]}" -ne 1 ] || [ "${#intel_dmgs[@]}" -ne 1 ]; then
            echo 'Expected one Windows installer, Linux AppImage/deb and two macOS dmg files.' >&2
            exit 1
          fi
          for bundle in "${appimages[@]}" "${debs[@]}" "${arm_dmgs[@]}" "${intel_dmgs[@]}"; do
            test -f "$bundle.sha256"
            ( cd release-candidate && sha256sum -c "$(basename "$bundle").sha256" )
          done
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            extension=''
            if [[ "$target" == win32-* ]]; then extension='.exe'; fi
            binary="kiki-$target$extension"
            test -f "cli-native/$binary"
            test -f "cli-native/$binary.sha256"
            ( cd cli-native && sha256sum -c "$binary.sha256" )
          done

      - name: Create or resume exact release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$KIKI_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$KIKI_TAG" --json isDraft --jq .isDraft)"
            echo "Resuming existing release $KIKI_TAG (draft=$is_draft); every existing asset must match before reuse."
            exit 0
          fi
          notes_file=".github/release-notes/kiki-${KIKI_VERSION}.md"
          args=(release create "$KIKI_TAG" --verify-tag --draft --title "Kiki $KIKI_VERSION")
          if [ -f "$notes_file" ]; then
            args+=(--notes-file "$notes_file")
            echo "Using release notes from $notes_file"
          else
            args+=(--generate-notes --notes "Desktop: Windows x64 NSIS (includes CLI), Linux x64 AppImage/deb, macOS Apple Silicon/Intel dmg (unsigned, not notarized). CLI: platform-named standalone Linux/macOS executables and .sha256 checksums; no archives. npm: kiki-agent (desktop + CLI) or kiki-agent-lite (CLI only), Node.js 24.15+. On macOS, see the installation guide for first-open and CLI linking: https://x-t-e-r.github.io/kiki/en/getting-started/installation")
            echo "No curated notes at $notes_file; generating notes from commits with installation details."
          fi
          if [ "$KIKI_CHANNEL" = 'beta' ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Sign updater with production key
        shell: bash
        env:
          KIKI_UPDATER_PUBLIC_KEY: ${{ vars.KIKI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          installers=(release-candidate/*.exe)
          shopt -u nullglob
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one release candidate, found ${#installers[@]}." >&2
            exit 1
          fi
          installer="$(realpath "${installers[0]}")"
          installer_name="$(basename "$installer")"
          remote_assets="$(gh release view "$KIKI_TAG" --json assets --jq '.assets[].name')"
          recovery="$RUNNER_TEMP/release-recovery"
          mkdir -p "$recovery"
          if grep -Fxq "$installer_name" <<<"$remote_assets"; then
            gh release download "$KIKI_TAG" --pattern "$installer_name" --dir "$recovery"
            if ! cmp -s "$installer" "$recovery/$installer_name"; then
              echo "Existing release installer differs: $installer_name" >&2
              exit 1
            fi
          fi
          if grep -Fxq "$installer_name.sig" <<<"$remote_assets"; then
            gh release download "$KIKI_TAG" --pattern "$installer_name.sig" --dir "$recovery"
            cp "$recovery/$installer_name.sig" "$installer.sig"
          else
            if [ "$(gh release view "$KIKI_TAG" --json isDraft --jq .isDraft)" != 'true' ]; then
              echo "Published release is missing updater signature; refusing to mutate public assets: $installer_name.sig" >&2
              exit 1
            fi
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo 'TAURI_SIGNING_PRIVATE_KEY secret is required to publish the updater signature.' >&2
              exit 1
            fi
            pnpm --filter @kiki/gui exec tauri signer sign "$installer"
          fi
          if [ ! -s "$installer.sig" ]; then
            echo 'Production updater signature is missing or empty.' >&2
            exit 1
          fi
          node apps/kiki-gui/scripts/verify-updater-signature.mjs \
            --installer "$installer" \
            --signature "$installer.sig" \
            --public-key "$KIKI_UPDATER_PUBLIC_KEY"

      - name: Create versioned release metadata
        shell: bash
        run: |
          installer="$(find release-candidate -maxdepth 1 -name '*.exe' | head -n 1)"
          remote_assets="$(gh release view "$KIKI_TAG" --json assets --jq '.assets[].name')"
          if grep -Fxq 'latest.json' <<<"$remote_assets"; then
            recovery="$RUNNER_TEMP/release-recovery"
            mkdir -p "$recovery"
            gh release download "$KIKI_TAG" --pattern latest.json --dir "$recovery"
            published_at="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).pub_date)" "$recovery/latest.json")"
          else
            published_at="$(node -e "console.log(new Date().toISOString())")"
          fi
          notes_file=".github/release-notes/kiki-${KIKI_VERSION}.md"
          notes=''
          if [ -f "$notes_file" ]; then
            notes="$(cat "$notes_file")"
          else
            notes="Kiki $KIKI_VERSION $KIKI_CHANNEL release. See the GitHub Release page for details."
          fi
          node apps/kiki-gui/scripts/desktop-release-manifest.mjs \
            --version "$KIKI_VERSION" \
            --tag "$KIKI_TAG" \
            --installer "$installer" \
            --signature "$installer.sig" \
            --output 'release-candidate/latest.json' \
            --sha256-output "$installer.sha256" \
            --pub-date "$published_at" \
            --notes "$notes"

      - name: Upload draft assets without replacement
        shell: bash
        run: |
          installer="$(find release-candidate -maxdepth 1 -name '*.exe' | head -n 1)"
          assets=(
            "$installer"
            "$installer.sig"
            "$installer.sha256"
            'release-candidate/latest.json'
            'apps/kiki-gui/THIRD_PARTY_NOTICES.md'
          )
          shopt -s nullglob
          for asset in release-candidate/*.AppImage release-candidate/*.AppImage.sha256 release-candidate/*.deb release-candidate/*.deb.sha256 release-candidate/*.dmg release-candidate/*.dmg.sha256 cli-native/kiki-linux-* cli-native/kiki-darwin-*; do
            assets+=("$asset")
          done
          shopt -u nullglob
          remote_assets="$(gh release view "$KIKI_TAG" --json assets --jq '.assets[].name')"
          is_draft="$(gh release view "$KIKI_TAG" --json isDraft --jq .isDraft)"
          recovery="$RUNNER_TEMP/release-recovery/upload"
          mkdir -p "$recovery"
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" <<<"$remote_assets"; then
              gh release download "$KIKI_TAG" --pattern "$name" --dir "$recovery"
              if ! cmp -s "$asset" "$recovery/$name"; then
                echo "Existing release asset differs: $name" >&2
                exit 1
              fi
              echo "Reusing exact existing release asset: $name"
            else
              if [ "$is_draft" != 'true' ]; then
                echo "Published release is missing asset; refusing to mutate public assets: $name" >&2
                exit 1
              fi
              gh release upload "$KIKI_TAG" "$asset"
            fi
          done

      - name: Validate draft assets
        shell: bash
        run: |
          download="$RUNNER_TEMP/draft-assets"
          mkdir -p "$download"
          gh release download "$KIKI_TAG" --dir "$download" --clobber

          installer="$(find release-candidate -maxdepth 1 -name '*.exe' | head -n 1)"
          installer_name="$(basename "$installer")"

          # Assets whose local copy lives under release-candidate/.
          for name in "$installer_name" "$installer_name.sig" "$installer_name.sha256" 'latest.json'; do
            if [ ! -f "$download/$name" ]; then
              echo "Draft asset is missing: $name" >&2
              exit 1
            fi
            local_sha="$(sha256sum "release-candidate/$name" | cut -d' ' -f1)"
            remote_sha="$(sha256sum "$download/$name" | cut -d' ' -f1)"
            if [ "$local_sha" != "$remote_sha" ]; then
              echo "Draft asset differs from the validated local file: $name" >&2
              exit 1
            fi
          done

          # Assets shipped from other locations.
          for name in 'THIRD_PARTY_NOTICES.md'; do
            if [ ! -f "$download/$name" ]; then
              echo "Draft asset is missing: $name" >&2
              exit 1
            fi
            local_sha="$(sha256sum "apps/kiki-gui/$name" | cut -d' ' -f1)"
            remote_sha="$(sha256sum "$download/$name" | cut -d' ' -f1)"
            if [ "$local_sha" != "$remote_sha" ]; then
              echo "Draft asset differs from the validated local file: $name" >&2
              exit 1
            fi
          done

          # Compare every desktop bundle, CLI executable, and adjacent checksum
          # with the exact bytes validated before the draft was created.
          shopt -s nullglob
          for asset in release-candidate/*.AppImage release-candidate/*.AppImage.sha256 release-candidate/*.deb release-candidate/*.deb.sha256 release-candidate/*.dmg release-candidate/*.dmg.sha256 cli-native/kiki-linux-* cli-native/kiki-darwin-*; do
            name="$(basename "$asset")"
            if [ ! -f "$download/$name" ] || ! cmp -s "$asset" "$download/$name"; then
              echo "Draft asset is missing or differs: $name" >&2
              exit 1
            fi
          done
          shopt -u nullglob

      - name: Build and stage npm distributions
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @kiki/gui run desktop:version:check
          test -f "$KIKI_BUILT_IN_CATALOG_FILE"
          export KIKI_AUTH_NATIVE_ARTIFACT_ROOT="$PWD/cli-native/auth-native"
          export KIKI_WINDOWS_PROCESS_HELPER_ARTIFACT="$PWD/cli-native/windows-process-helper/win32-x64/windows-process-helper.exe"
          pnpm --filter @kiki/cli run build
          node apps/kimi-code/scripts/npm/stage.mjs
          node apps/kimi-code/scripts/native/release-receipt.mjs stage-npm \
            --npm-root apps/kimi-code/dist-npm \
            --output apps/kimi-code/dist-npm/release-receipt.json \
            --receipt "$RUNNER_TEMP/kiki-release-input/release-input.json" \
            --catalog "$KIKI_BUILT_IN_CATALOG_FILE" \
            --prepare-artifact-id "$KIKI_PREPARE_ARTIFACT_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$KIKI_SOURCE_SHA" \
            --tag "$KIKI_TAG" \
            --version "$KIKI_VERSION" \
            --channel "$KIKI_CHANNEL" \
            --run-id "$GITHUB_RUN_ID" \
            --prepare-attempt "$KIKI_PREPARE_ATTEMPT" \
            --candidate-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Smoke-test isolated npm CLI install
        shell: bash
        run: |
          set -euo pipefail
          stage="$(realpath apps/kimi-code/dist-npm/lite)"
          test_dir="$RUNNER_TEMP/kiki-npm-smoke"
          mkdir -p "$test_dir"
          tarball="$(cd "$stage" && npm pack --silent --pack-destination "$test_dir" --registry=https://registry.npmjs.org/)"
          npm install --prefix "$test_dir/install" --omit=optional --no-audit --no-fund --registry=https://registry.npmjs.org/ "$test_dir/$tarball"
          "$test_dir/install/node_modules/.bin/kiki" --version | grep -Fx "$KIKI_VERSION"
          "$test_dir/install/node_modules/.bin/kiki" desktop --help
          node apps/kimi-code/scripts/native/release-receipt.mjs verify-npm \
            --npm-root apps/kimi-code/dist-npm \
            --receipt apps/kimi-code/dist-npm/release-receipt.json \
            --prepare-receipt "$RUNNER_TEMP/kiki-release-input/release-input.json" \
            --catalog "$KIKI_BUILT_IN_CATALOG_FILE" \
            --prepare-artifact-id "$KIKI_PREPARE_ARTIFACT_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$KIKI_SOURCE_SHA" \
            --tag "$KIKI_TAG" \
            --version "$KIKI_VERSION" \
            --channel "$KIKI_CHANNEL" \
            --run-id "$GITHUB_RUN_ID" \
            --prepare-attempt "$KIKI_PREPARE_ATTEMPT"

      - name: Publish validated release
        run: gh release edit "$KIKI_TAG" --draft=false

      - name: Publish npm CLI/TUI and desktop distributions
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_TOKEN is required to publish npm packages.' >&2
            exit 1
          fi
          for kind in lite full; do
            package="apps/kimi-code/dist-npm/$kind"
            name="$(node -p "require('./$package/package.json').name")"
            expected="$(npm pack "$package" --silent --json --dry-run --registry=https://registry.npmjs.org/ | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s)[0].integrity))")"
            published="$(npm view "$name@$KIKI_VERSION" dist.integrity --json --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            published="${published%\"}"
            published="${published#\"}"
            if [ -n "$published" ]; then
              if [ "$published" != "$expected" ]; then
                echo "Published npm package differs: $name@$KIKI_VERSION" >&2
                exit 1
              fi
              echo "Reusing exact npm package: $name@$KIKI_VERSION"
            else
              npm publish "$package" --access public --registry=https://registry.npmjs.org/
            fi
          done
