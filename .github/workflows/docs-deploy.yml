name: Deploy Docs to GitHub Pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, kiki]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm -C docs run build
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/

      - name: Test updater feed selection
        run: node --test apps/kiki-gui/scripts/desktop-release-feed.test.mjs

      - name: Build feeds from anonymously accessible Releases
        run: node apps/kiki-gui/scripts/desktop-release-feed.mjs --repository X-T-E-R/kiki --output-dir docs/.vitepress/dist/updater

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/kiki'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
