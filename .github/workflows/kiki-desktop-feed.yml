name: Kiki Desktop Updater Feed

on:
  workflow_run:
    workflows:
      - Kiki Desktop Release
      - Deploy Docs to GitHub Pages
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test feed selection
        run: node --test apps/kiki-gui/scripts/desktop-release-feed.test.mjs

      - name: Build documentation site
        run: pnpm -C docs run build
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/

      - name: Build feeds from anonymously accessible Releases
        run: node apps/kiki-gui/scripts/desktop-release-feed.mjs --repository X-T-E-R/kiki --output-dir docs/.vitepress/dist/updater

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
