name: Kiki Desktop Windows CI

on:
  pull_request:
    paths:
      - '.github/workflows/kiki-desktop-*.yml'
      - 'apps/kiki-desktop/**'
      - 'apps/kiki-gui/**'
      - 'apps/kimi-code/scripts/native/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop release scripts
        shell: pwsh
        run: |
          node --test apps/kiki-gui/scripts/desktop-version.test.mjs apps/kiki-gui/scripts/desktop-release-manifest.test.mjs apps/kiki-gui/scripts/desktop-release-feed.test.mjs apps/kiki-gui/scripts/verify-updater-signature.test.mjs
          pnpm --filter @kiki/gui run desktop:version:check
          pnpm --filter @kiki/gui run desktop:release:test

      - name: Test GUI and Electron desktop shell
        run: |
          pnpm --filter @kiki/gui run typecheck
          pnpm --filter @kiki/gui run test
          pnpm --filter @kiki/desktop run typecheck
          pnpm --filter @kiki/desktop run test:fast

      - name: Package and smoke-test Windows x64 Electron desktop
        run: |
          pnpm --filter @kiki/desktop run package:dir
          pnpm --filter @kiki/desktop run smoke:node

      - name: Generate temporary updater key
        shell: pwsh
        run: |
          $password = [guid]::NewGuid().ToString('N')
          $keyPath = Join-Path $env:RUNNER_TEMP 'kiki-ci-updater.key'
          pnpm --filter @kiki/gui exec tauri signer generate --ci --password $password --write-keys $keyPath
          $publicKey = (Get-Content "$keyPath.pub" | Select-Object -Last 1).Trim()
          $delimiter = "KIKI_SIGNING_KEY_$([guid]::NewGuid().ToString('N'))"
          "TAURI_SIGNING_PRIVATE_KEY<<$delimiter" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Get-Content $keyPath -Raw).TrimEnd() | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $delimiter | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KIKI_UPDATER_PUBLIC_KEY=$publicKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build NSIS updater artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          KIKI_DESKTOP_DISTRIBUTION: github
        shell: pwsh
        run: |
          pnpm --filter @kiki/desktop exec electron-builder --win nsis --x64 --publish never
          $installers = @(Get-ChildItem 'apps/kiki-desktop/out' -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          pnpm --filter @kiki/gui exec tauri signer sign $installers[0].FullName
          if (-not (Test-Path -LiteralPath "$($installers[0].FullName).sig" -PathType Leaf)) {
            throw 'Updater signer did not create the installer signature.'
          }
          node apps/kiki-gui/scripts/verify-updater-signature.mjs --installer $installers[0].FullName --signature "$($installers[0].FullName).sig" --public-key $env:KIKI_UPDATER_PUBLIC_KEY
