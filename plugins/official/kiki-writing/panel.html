<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manuscript</title>
  <style>
    body { margin: 0; background: #f7f3ea; color: #332d27; font: 16px/1.55 Georgia, serif; }
    main { max-width: 680px; padding: 26px; margin: auto; }
    h1 { font-size: 27px; font-weight: 400; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #665b4f; }
    textarea { box-sizing: border-box; width: 100%; min-height: 280px; padding: 20px; background: #fffdf7; border: 1px solid #cfc5b7; border-radius: 8px; color: #332d27; font: inherit; resize: vertical; }
    button { margin-top: 14px; padding: 10px 17px; border: 0; border-radius: 6px; background: #534737; color: white; font: 14px Georgia, serif; cursor: pointer; }
    #status { font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Manuscript</h1>
    <p>Draft here, then send the passage to your current Kiki session.</p>
    <textarea id="draft" aria-label="Draft passage" placeholder="Begin a passage…"></textarea>
    <button id="send" type="button">Send to session</button>
    <p id="status" role="status"></p>
  </main>
  <script>
    let sessionId;
    let sequence = 0;
    const pending = new Map();
    const status = document.querySelector('#status');
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent || !event.data || event.data.channel !== 'kiki.panel.v1') return;
      if (event.data.kind === 'init') { sessionId = event.data.sessionId; status.textContent = 'Ready to send'; }
      if (event.data.kind === 'response') {
        const settle = pending.get(event.data.id);
        if (settle) { pending.delete(event.data.id); settle(event.data); }
      }
    });
    document.querySelector('#send').addEventListener('click', async () => {
      const text = document.querySelector('#draft').value.trim();
      if (!sessionId || !text) { status.textContent = 'Open a session and write a passage first.'; return; }
      const id = ++sequence;
      const response = new Promise((resolve) => pending.set(id, resolve));
      window.parent.postMessage({ channel: 'kiki.panel.v1', kind: 'request', id,
        method: 'session.sendMessage', sessionId, text }, '*');
      const result = await response;
      status.textContent = result.ok ? 'Sent to session.' : 'The message was not sent. Try again.';
    });
  </script>
</body>
</html>
