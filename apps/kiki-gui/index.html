<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B2226" />
    <!-- Add to Home Screen: the served GUI opens as its own standalone window. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kiki" />
    <title>kiki</title>
    <!-- Resolve the theme before first paint; the module bundle re-applies it
         and then keeps it in sync (src/lib/theme.ts). Without this, a dark
         user gets a paper-white flash while the bundle loads. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('kiki.settings') || '{}');
          var pref = stored.theme === 'light' || stored.theme === 'dark' ? stored.theme : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
